<!DOCTYPE html>
<html>
<head>
<title>CTRAX Results</title>

<style>

body{
font-family:'Segoe UI', sans-serif;
background:#f5f7fa;
margin:0;
}

header{
background:#0B2C4D;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.container{
padding:30px;
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.title{
font-size:22px;
margin-bottom:20px;
}

button{
padding:10px 15px;
margin-top:20px;
background:#1F6FEB;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<header>CTRAX Results</header>

<div class="container">

<div id="results"></div>

</div>

<script>

// 🔍 GET URL PARAMETERS
const params = new URLSearchParams(window.location.search);
const query = params.get("query");
const type = params.get("type");

const resultsDiv = document.getElementById("results");

// Show header
resultsDiv.innerHTML = `<div class="title">Results for: ${query} (${type})</div>`;


// 🚗 VIN SEARCH (REAL DATA)
if(type === "vin"){

  fetch("http://localhost:5000/api/vin/" + query)
  .then(res => res.json())
  .then(data => {

    data.Results.forEach(item => {
      if(item.Value){

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <strong>${item.Variable}</strong><br>
          ${item.Value}
        `;

        resultsDiv.appendChild(div);
      }
    });

  })
  .catch(() => {
    resultsDiv.innerHTML += "<p>Error fetching VIN data</p>";
  });

}


// 🚗 PLATE SEARCH (SIGHTINGS)
else if(type === "plate"){

  fetch("http://localhost:5000/api/sightings/" + query)
  .then(res => res.json())
  .then(data => {

    if(data.length === 0){
      resultsDiv.innerHTML += "<p>No sightings yet.</p>";
    }

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <strong>${item.plate}</strong><br>
        📍 ${item.location}<br>
        🕒 ${item.time}
      `;

      resultsDiv.appendChild(div);
    });

  });

}


// 🔎 DEFAULT (PEOPLE / PHONE / ADDRESS)
else {

  for(let i = 1; i <= 5; i++){

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <strong>${query} ${i}</strong><br>
      Possible Match • Click for Report
    `;

    div.onclick = () => {
      window.location.href = "/report.html?name=" + encodeURIComponent(query);
    };

    resultsDiv.appendChild(div);
  }

}


// ➕ ADD SIGHTING BUTTON (ONLY FOR PLATE)
if(type === "plate"){

  const btn = document.createElement("button");
  btn.innerText = "➕ Add Sighting";

  btn.onclick = () => {
    const location = prompt("Enter location:");

    if(!location) return;

    fetch("http://localhost:5000/api/sighting", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ plate: query, location })
    })
    .then(() => {
      alert("Sighting added!");
      location.reload();
    });
  };

  resultsDiv.appendChild(btn);
}

</script>

</body>
</html>
