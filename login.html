<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CTRAX Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,.25),
        rgba(0,0,0,.25)
    ),
    url('/images/ctrax-login-bg.jpg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Login Card */

.login-card{

    width:420px;

    padding:40px;

    border-radius:28px;

    background:
    rgba(0,8,25,.72);

    backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 60px rgba(0,80,255,.18);

}

/* CTRAX Logo */

.logo{

    display:block;

    width:280px;

    margin:0 auto 30px auto;

}

/* Inputs */

.input{

    width:100%;

    padding:18px;

    margin-bottom:18px;

    border-radius:14px;

    border:
    1px solid rgba(255,255,255,.08);

    background:
    rgba(0,0,0,.30);

    color:white;

    font-size:16px;

}

.input::placeholder{

    color:#9aa6c3;

}

.input:focus{

    outline:none;

    border-color:#1e88ff;

}

/* Button */

.btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:14px;

    background:#0d5dff;

    color:white;

    font-size:20px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

}

.btn:hover{

    background:#1f6cff;

}

/* Footer */

.footer{

    margin-top:25px;

    text-align:center;

    color:#d0d7e7;

    font-size:14px;

}

.footer a{

    color:#1e88ff;

    text-decoration:none;

    font-weight:600;

}

.footer a:hover{

    text-decoration:underline;

}

.forgot{

    display:block;

    margin-bottom:15px;

}

.copyright{

    position:absolute;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.45);

    font-size:12px;

}

@media(max-width:768px){

    .login-card{

        width:92%;

        max-width:420px;

        padding:30px;

    }

    .logo{

        width:220px;

    }

}

</style>

</head>

<body>

<div class="login-card">

    <img
    src="/images/ctrax-logo.png"
    class="logo"
    alt="CTRAX">

    <form action="/login" method="POST">

        <input
        type="email"
        name="email"
        class="input"
        placeholder="Email Address"
        required>

        <input
        type="password"
        name="password"
        class="input"
        placeholder="Password"
        required>

        <button
        type="submit"
        class="btn">
        Sign In
        </button>

    </form>

    <div class="footer">

        <a
        href="/forgot-password"
        class="forgot">
        Forgot Password?
        </a>

        Don't have an account?

        <a href="/signup">
        Sign Up
        </a>

    </div>

</div>

<div class="copyright">
© 2026 CTRAX SAFETY SYSTEMS. ALL RIGHTS RESERVED.
</div>

</body>
</html>
