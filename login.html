<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTRAX Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;

background:
linear-gradient(
180deg,
#010817,
#03132d,
#010817
);

display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* Background */
.bg{
position:absolute;
inset:0;

background:
radial-gradient(circle at center,
#06205a 0%,
#02132f 45%,
#010817 100%);

z-index:0;

}

/* TRAX Camera */
.camera{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%) scale(.82);
width:520px;
z-index:1;
}

/* TRAX CAM MAP */
.trax-map{
position:absolute;
right:90px;
top:160px;
width:320px;
opacity:.95;
z-index:1;
}

/* Active Zone */
.active-zone{
position:absolute;
right:115px;
top:120px;
color:#1e88ff;
z-index:2;
}

.active-zone h3{
font-size:30px;
font-weight:600;
}

.active-zone p{
font-size:18px;
}

/* Login Card */
.login-card{

position:relative;
z-index:5;

width:420px;

padding:45px;

border-radius:28px;

background:
rgba(0,10,30,.65);

backdrop-filter:blur(18px);

border:
1px solid rgba(255,255,255,.12);

box-shadow:
0 0 50px rgba(0,80,255,.18);

}

/* Logo */
.logo{
display:block;
width:290px;
margin:0 auto 30px;
}

/* Inputs */
.input{
width:100%;
padding:18px;
margin-bottom:18px;

border-radius:14px;

background:
rgba(0,0,0,.35);

border:
1px solid rgba(255,255,255,.08);

color:white;
font-size:16px;
}

.input:focus{
outline:none;
border-color:#1e88ff;
}

/* Button */
.btn{
width:100%;
padding:18px;

border:none;

border-radius:14px;

background:#0b5cff;

color:white;

font-size:20px;
font-weight:700;

cursor:pointer;
}

.btn:hover{
background:#1d6cff;
}

.footer{
margin-top:22px;
text-align:center;
color:#ccc;
}

.footer a{
color:#1e88ff;
text-decoration:none;
}

</style>
</head>

<body>

<div class="bg"></div>

<img src="/images/trax-camera.png" class="camera">

<div class="active-zone">
<h3>TRAX CAM</h3>
<p>DOWNTOWN</p>
</div>

<img src="/images/trax-map.png" class="trax-map">

<div class="login-card">

<img src="/images/ctrax-logo.png" class="logo">

<form action="/login" method="POST">

<input
class="input"
type="email"
name="email"
placeholder="Email"
required>

<input
class="input"
type="password"
name="password"
placeholder="Password"
required>

<button class="btn">
Sign In
</button>

</form>

<div class="footer">
Forgot Password?<br><br>
Don't have an account?
<a href="/signup">Sign Up</a>
</div>

</div>

</body>
</html>
