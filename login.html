<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTRAX Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top right, rgba(0,122,255,0.18), transparent 40%),
    radial-gradient(circle at bottom left, rgba(0,122,255,0.10), transparent 35%),
    linear-gradient(135deg, #020814 0%, #071a38 45%, #03101f 100%);
  color: #ffffff;
}

.login-card {
  width: 100%;
  max-width: 420px;
  padding: 48px 40px;
  border-radius: 22px;
  background: rgba(9, 22, 48, 0.82);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  backdrop-filter: blur(14px);
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 10px;
  margin-bottom: 36px;
  color: #ffffff;
}

.form-group {
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.96);
  color: #111827;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #0a84ff;
  box-shadow: 0 0 0 3px rgba(10,132,255,0.18);
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #0a84ff, #2ea8ff);
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 6px;
}

button:hover {
  opacity: 0.96;
}

#error {
  color: #ff5f57;
  margin-top: 12px;
  min-height: 20px;
  text-align: center;
  font-size: 14px;
}

.signup-link {
  margin-top: 24px;
  text-align: center;
  color: rgba(255,255,255,0.75);
  font-size: 14px;
}

.signup-link a {
  color: #2ea8ff;
  text-decoration: none;
}

.signup-link a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">CTRAX</div>

  <form onsubmit="login(event)">
    <div class="form-group">
      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >
    </div>

    <div class="form-group">
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >
    </div>

    <button type="submit">Sign In</button>

    <div id="error"></div>
  </form>

  <div class="signup-link">
    Don't have an account?
    <a href="signup.html">Sign up</a>
  </div>
</div>

<script>
async function login(event) {
  event.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('error');

  errorBox.textContent = '';

  try {
    const response = await fetch('/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await response.json();

    if (data.success) {
      window.location.href = '/homepage.html';
    } else {
      errorBox.textContent = data.message || 'Login failed';
    }
  } catch (error) {
    console.error('Login error:', error);
    errorBox.textContent = 'Server error';
  }
}
</script>

</body>
</html>
