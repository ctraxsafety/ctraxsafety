<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTRAX Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
135deg,
#01040c,
#02152f,
#001d5a
);
position:relative;
}

/* Camera Background */
.camera-bg{
position:absolute;
width:900px;
max-width:90%;
opacity:.45;
z-index:1;
}

/* Login Card */
.login-card{
position:relative;
z-index:10;

width:480px;

padding:50px;

border-radius:30px;

background:rgba(8,15,35,.65);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 30px 80px rgba(0,0,0,.5);
}

/* Logo */
.logo{
display:block;
width:320px;
margin:0 auto 35px;
}

.input{
width:100%;
padding:16px;
margin-bottom:20px;

border-radius:12px;

border:1px solid rgba(255,255,255,.08);

background:rgba(255,255,255,.03);

color:white;

font-size:16px;
}

.input:focus{
outline:none;
border-color:#2f7cff;
}

.signin{
width:100%;
padding:18px;

background:#0d5dff;

border:none;

border-radius:14px;

font-size:18px;

font-weight:700;

color:white;

cursor:pointer;
}

.signin:hover{
background:#1d6bff;
}
</style>
</head>
<body>

<img
src="/trax-camera-bg.png"
class="camera-bg"
alt="TRAX Safety Camera"
>

<div class="login-card">

<img
src="/ctrax-logo.png"
class="logo"
alt="CTRAX"
>

<form action="/login" method="POST">

<input
type="email"
name="email"
placeholder="Email"
class="input"
required
>

<input
type="password"
name="password"
placeholder="Password"
class="input"
required
>

<button
type="submit"
class="signin"
>
Sign In
</button>

</form>

</div>

</body>
</html>
