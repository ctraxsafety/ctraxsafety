<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAX Safety | Live Intelligence Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0a0f1c;
    color: #ffffff;
    overflow: hidden;
}

.topbar {
    height: 70px;
    background: #101827;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
}

.logo {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    color: #00bfff;
}

.tabs {
    display: flex;
    gap: 25px;
    font-size: 0.95rem;
    font-weight: 600;
}

.tabs span {
    color: rgba(255,255,255,0.75);
    cursor: pointer;
}

.tabs span.active {
    color: #00bfff;
}

.logout-btn {
    background: linear-gradient(135deg, #0a84ff, #00bfff);
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
}

.main {
    display: flex;
    height: calc(100vh - 70px);
}

.sidebar {
    width: 380px;
    background: #111827;
    border-right: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-header h2 {
    font-size: 1.4rem;
    margin-bottom: 8px;
}

.sidebar-header p {
    color: rgba(255,255,255,0.7);
    font-size: 0.9rem;
}

.detections {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.detection-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}

.detection-card h3 {
    color: #00d4ff;
    font-size: 1.2rem;
    margin-bottom: 10px;
}

.detection-card p {
    margin: 4px 0;
    font-size: 0.92rem;
    color: rgba(255,255,255,0.88);
}

.map-container {
    flex: 1;
    position: relative;
}

#map {
    width: 100%;
    height: 100%;
}

.map-title {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(17, 24, 39, 0.92);
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
}

.map-title h1 {
    font-size: 1.2rem;
    margin-bottom: 4px;
}

.map-title p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
}

.status-bar {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    background: rgba(17, 24, 39, 0.92);
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
}

.status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #00ff88;
    border-radius: 50%;
    margin-right: 8px;
}

.empty-state {
    color: rgba(255,255,255,0.6);
    text-align: center;
    padding: 40px 20px;
    line-height: 1.6;
}

@media (max-width: 900px) {
    .main {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        height: 45%;
    }

    .map-container {
        height: 55%;
    }

    .tabs {
        display: none;
    }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">CTRAX <span>SAFETY</span></div>

    <div class="tabs">
        <span class="active">Plate</span>
        <span>VIN</span>
        <span>Heatmap</span>
        <span>Playback</span>
        <span>Reports</span>
        <span>Account</span>
    </div>

    <a href="/login.html" class="logout-btn">Logout</a>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Live Detections</h2>
            <p>Auto-refreshing every 5 seconds</p>
        </div>

        <div class="detections" id="detections">
            <div class="empty-state">
                Waiting for TRAX Safety detections...
            </div>
        </div>
    </div>

    <div class="map-container">
        <div class="map-title">
            <h1>TRAX Safety Intelligence Map</h1>
            <p>Real-time vehicle detection monitoring</p>
        </div>

        <div id="map"></div>

        <div class="status-bar">
            <span class="status-dot"></span>
            System Online
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Initialize map centered on Indianapolis, Indiana
const map = L.map('map').setView([39.7684, -86.1581], 11);

// OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Store current map markers
let markers = [];

// Remove all markers from the map
function clearMarkers() {
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];
}

// Render detections in the left sidebar
function renderDetections(sightings) {
    const container = document.getElementById('detections');

    if (!sightings || sightings.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                Waiting for TRAX Safety detections...
            </div>
        `;
        return;
    }

    container.innerHTML = '';

    sightings.forEach(sighting => {
        const card = document.createElement('div');
        card.className = 'detection-card';

        card.innerHTML = `
            <h3>${sighting.plate || 'UNKNOWN'}</h3>
            <p><strong>Vehicle:</strong> ${sighting.vehicle || 'Unknown Vehicle'}</p>
            <p><strong>Speed:</strong> ${sighting.speed || 0} mph</p>
            <p><strong>Location:</strong> ${sighting.location || 'Unknown Location'}</p>
        `;

        container.appendChild(card);
    });
}

// Add markers to the map
function renderMarkers(sightings) {
    clearMarkers();

    sightings.forEach(sighting => {
        // Use saved coordinates if available,
        // otherwise place markers near Indianapolis.
        const lat = sighting.latitude ||
                    (39.7684 + (Math.random() - 0.5) * 0.1);

        const lng = sighting.longitude ||
                    (-86.1581 + (Math.random() - 0.5) * 0.1);

        const marker = L.marker([lat, lng]).addTo(map);

        marker.bindPopup(`
            <strong>${sighting.plate || 'UNKNOWN'}</strong><br>
            ${sighting.vehicle || 'Unknown Vehicle'}<br>
            ${sighting.speed || 0} mph<br>
            ${sighting.location || 'Unknown Location'}
        `);

        markers.push(marker);
    });
}

// Load sightings from the CTRAX API
async function loadSightings() {
    try {
        const response = await fetch('/api/sightings');
        const data = await response.json();

        // Support both response formats:
        // 1. { success: true, sightings: [...] }
        // 2. [ ... ]
        const sightings = Array.isArray(data)
            ? data
            : (data.sightings || []);

        renderDetections(sightings);
        renderMarkers(sightings);

    } catch (error) {
        console.error('Failed to load sightings:', error);
    }
}

// Initial load
loadSightings();

// Refresh every 5 seconds
setInterval(loadSightings, 5000);
</script>

</body>
</html>
