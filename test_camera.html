<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTRAX SAFETY | TRAX Safety Intelligence Platform</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style></head>
<body>

<div class="app">



    <!-- ======================================================
         HEADER
    ======================================================= -->
    <header class="header">
        <div class="logo">
            <!-- Replace ctrax-logo.png with your actual logo filename -->
            <img src="ctrax-logo.png" alt="CTRAX Logo">
        </div>

        <div class="search-container">
            <span class="search-icon">⌕</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Search plate, VIN, vehicle, or location..."
            >
        </div>

        <div class="nav-tabs">
            <button class="active" onclick="setView('plate', this)">Plate</button>
            <button onclick="setView('vin', this)">VIN</button>
            <button onclick="setView('heatmap', this)">Heatmap</button>
            <button onclick="setView('playback', this)">Playback</button>
        </div>

        <div class="header-actions">
            <a href="#" class="header-link">Reports</a>
            <a href="#" class="header-link">Account</a>
            <a href="/login.html" class="header-link">Logout</a>
        </div>
    </header>

    <!-- ======================================================
         MAIN CONTENT
    ======================================================= -->
    <main class="main">

        <!-- LEFT SIDEBAR -->
        <aside class="panel sidebar">
            <div class="sidebar-header">
                <h2>Live Detections</h2>
                <p>Real-time TRAX Safety vehicle sightings</p>
            </div>

            <div class="detections" id="detections">
                <div class="empty-state">
                    Waiting for live detections from TRAX Safety...
                </div>
            </div>
        </aside>

        <!-- MAP PANEL -->
        <section class="map-panel">
            <div class="map-overlay">
                <h1>TRAX Safety Intelligence Map</h1>
                <p>Real-time vehicle detection and route analytics</p>
            </div>

            <div id="map"></div>
        </section>

    </main>
    </div> <!-- End .app -->

    <!-- ======================================================
         LEAFLET JS
    ======================================================= -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    // ==========================================================
    // MAPBOX CONFIGURATION
    // Replace with your actual Mapbox public token
    // ==========================================================
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiY2RhdmlzMTczMTciLCJhIjoiY21wY2hrOGkxMDFpMzJ3cTBtNDdpYjQ4ciJ9.BhFwz7u74_-US7-kitnblA';

    // ==========================================================
    // INITIALIZE MAP
    // ==========================================================
    const map = L.map('map', {
        zoomControl: true,
        attributionControl: true
    }).setView([39.7684, -86.1581], 11); // Indianapolis, Indiana

    L.tileLayer(
        `https://api.mapbox.com/styles/v1/mapbox/navigation-night-v1/tiles/{z}/{x}/{y}?access_token=${MAPBOX_TOKEN}`,
        {
            tileSize: 512,
            zoomOffset: -1,
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap contributors &copy; Mapbox'
        }
    ).addTo(map);

    // ==========================================================
    // GLOBAL VARIABLES
    // ==========================================================
    let markers = [];
    let allSightings = [];

    // Placeholder license plate image (replace later with real crops)
    const DEFAULT_PLATE_IMAGE =
        'https://dummyimage.com/320x90/0b1320/ffffff&text=LICENSE+PLATE';

    // ==========================================================
    // MARKER HELPERS
    // ==========================================================
    function clearMarkers() {
        markers.forEach(marker => map.removeLayer(marker));
        markers = [];
    }

    function createMarker(lat, lng, sighting) {
    // Red = watchlist / speeding / alert
    // Blue = normal detection
    const isRed =
        sighting.alert === true ||
        sighting.watchlist === true ||
        (Number(sighting.speed) || 0) >= 80;

    const color = isRed ? '#ff3b4d' : '#0a3dff';
    const className = isRed ? 'pulse-marker-red' : 'pulse-marker-blue';

    // Create animated HTML marker
    const icon = L.divIcon({
        className: '',
        html: `
            <div class="${className}">
                <div class="pulse-ring"></div>
                <div class="pulse-core"></div>
            </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });

    const marker = L.marker([lat, lng], {
        icon: icon
    }).addTo(map);

    marker.bindPopup(`
        <strong>${sighting.plate || 'UNKNOWN'}</strong><br>
        ${sighting.vehicle || 'Unknown Vehicle'}<br>
        ${sighting.speed || 0} mph<br>
        ${sighting.location || 'Unknown Location'}<br>
        ${sighting.direction || 'Direction Unknown'}
    `);

    markers.push(marker);
}

    // ==========================================================
    // RENDER DETECTION CARDS
    // ==========================================================
    function renderDetections(sightings) {
        const container = document.getElementById('detections');

        if (!sightings || sightings.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    Waiting for live detections from TRAX Safety...
                </div>
            `;
            return;
        }

        container.innerHTML = '';

        sightings.slice(0, 100).forEach(sighting => {
            const isRed =
                sighting.alert === true ||
                sighting.watchlist === true ||
                (Number(sighting.speed) || 0) >= 80;

            const card = document.createElement('div');
            card.className =
                `detection-card ${isRed ? 'red' : 'blue'}`;

            const plateImage =
                sighting.plateImage ||
                sighting.plate_image ||
                DEFAULT_PLATE_IMAGE;

            card.innerHTML = `
                <h3>${sighting.plate || 'UNKNOWN'}</h3>

                <img
                    src="${plateImage}"
                    alt="License Plate"
                    class="plate-image"
                    onerror="this.src='${DEFAULT_PLATE_IMAGE}'"
                >

                <p><strong>Vehicle:</strong> ${sighting.vehicle || 'Unknown Vehicle'}</p>
                <p><strong>Speed:</strong> ${sighting.speed || 0} mph</p>
                <p><strong>Location:</strong> ${sighting.location || 'Unknown Location'}</p>
                <p><strong>Direction:</strong> ${sighting.direction || 'Unknown'}</p>
            `;

            // Zoom to detection when clicked
            card.addEventListener('click', () => {
                const lat = sighting.latitude ||
                    (39.7684 + (Math.random() - 0.5) * 0.1);

                const lng = sighting.longitude ||
                    (-86.1581 + (Math.random() - 0.5) * 0.1);

                map.flyTo([lat, lng], 14, {
                    duration: 1.5
                });
            });

            container.appendChild(card);
        });
    }
    // ==========================================================
    // RENDER MAP MARKERS
    // ==========================================================
    function renderMarkers(sightings) {
        clearMarkers();

        sightings.forEach(sighting => {
            const lat = sighting.latitude ||
                (39.7684 + (Math.random() - 0.5) * 0.1);

            const lng = sighting.longitude ||
                (-86.1581 + (Math.random() - 0.5) * 0.1);

            createMarker(lat, lng, sighting);
        });
    }

    // ==========================================================
    // SEARCH FILTER
    // ==========================================================
    function filterSightings() {
        const query = document
            .getElementById('searchInput')
            .value
            .toLowerCase()
            .trim();

        if (!query) {
            renderDetections(allSightings);
            renderMarkers(allSightings);
            return;
        }

        const filtered = allSightings.filter(sighting => {
            const searchableText = [
                sighting.plate || '',
                sighting.vehicle || '',
                sighting.location || '',
                sighting.direction || ''
            ]
            .join(' ')
            .toLowerCase();

            return searchableText.includes(query);
        });

        renderDetections(filtered);
        renderMarkers(filtered);
    }

    // ==========================================================
    // LOAD SIGHTINGS FROM CTRAX API
    // ==========================================================
    async function loadSightings() {
        try {
            const response = await fetch('/api/sightings');
            const data = await response.json();

            // Supports:
            // 1. { success: true, sightings: [...] }
            // 2. [ ... ]
            allSightings = Array.isArray(data)
                ? data
                : (data.sightings || []);

            filterSightings();

        } catch (error) {
            console.error('Failed to load sightings:', error);
        }
    }

    // ==========================================================
    // TAB NAVIGATION
    // ==========================================================
    function setView(view, button) {
        document.querySelectorAll('.nav-tabs button')
            .forEach(btn => btn.classList.remove('active'));

        button.classList.add('active');

        switch (view) {
           case 'heatmap':
    if (markers.length > 0) {
        markers.forEach(marker => {
            const element = marker.getElement();
            if (element) {
                element.style.opacity = '0.35';
                element.style.transform = 'scale(2.2)';
            }
        });
    }
    break;
            case 'playback':
    let index = 0;

    if (allSightings.length === 0) return;

    const playbackInterval = setInterval(() => {
        if (index >= allSightings.length) {
            clearInterval(playbackInterval);
            return;
        }

        const sighting = allSightings[index];

        const lat = sighting.latitude || 39.7684;
        const lng = sighting.longitude || -86.1581;

        map.flyTo([lat, lng], 14, {
            duration: 1.5
        });

        index++;
    }, 2000);
    break;
            case 'vin':
                alert('VIN search activated');
                break;
            default:
                // Plate view is the default live map
                break;
        }
    }

    // ==========================================================
    // EVENT LISTENERS
    // ==========================================================
    document
        .getElementById('searchInput')
        .addEventListener('input', filterSightings);

    // ==========================================================
    // INITIALIZE DASHBOARD
    // ==========================================================
    loadSightings();

    // Refresh detections every 5 seconds
    setInterval(loadSightings, 5000);

    </script>
</body>
</html>
